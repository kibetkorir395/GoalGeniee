<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline - Goal Genie</title>
  <meta name="robots" content="noindex" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b1220; color: #e6edf5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card { text-align: center; max-width: 480px; }
    .icon { font-size: 56px; margin-bottom: 16px; display: block; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 16px; line-height: 1.6; color: #94a3b8; margin-bottom: 24px; }
    a { display: inline-block; background: linear-gradient(135deg, #2f7fb8, #1f5f8c); color: #fff; padding: 12px 28px; border-radius: 999px; text-decoration: none; font-weight: 600; transition: transform 0.2s; }
    a:hover { transform: translateY(-2px); }
  </style>
</head>

<body>
  <div class="card">
    <span class="icon">📡</span>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Goal Genie will be back as soon as your connection returns.</p>
    <a href="/">Try Again</a>
  </div>
</body>

</html>
